<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>職業足球人生 5.0</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1d12;
      color: #333;
      max-width: 650px;
      margin: 15px auto;
      padding: 10px;
    }
    .card {
      background: #ffffff;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 15px;
    }
    h1 { margin: 0 0 5px 0; color: #1b4d24; text-align: center; font-size: 22px; }
    
    /* 建角畫面 */
    .setup-group { margin-bottom: 12px; text-align: left; }
    .setup-group label { display: block; font-weight: bold; margin-bottom: 4px; color: #1b4d24; }
    .setup-group input, .setup-group select {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px;
    }

    .status-bar {
      text-align: center; background: #1b4d24; color: #fff; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.95em;
    }
    .finance-bar {
      display: flex; justify-content: space-around; background: #e8f5e9; padding: 8px; border-radius: 8px; margin-top: 8px; font-size: 0.85em; font-weight: bold; color: #2e7d32;
    }

    /* 置頂廣播紀錄盒 (即時查看) */
    .ticker-box {
      background: #212121;
      color: #76ff03;
      border-radius: 8px;
      padding: 10px 12px;
      margin: 10px 0;
      max-height: 110px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85em;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
    }
    .ticker-box ul { list-style: none; padding: 0; margin: 0; }
    .ticker-box li { margin-bottom: 4px; border-bottom: 1px dashed #424242; padding-bottom: 2px; }
    
    /* 長條圖顯示能力 */
    .bar-container { margin: 12px 0; }
    .bar-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.85em; }
    .bar-label { width: 85px; font-weight: bold; color: #333; }
    .bar-bg { flex: 1; background: #e0e0e0; height: 18px; border-radius: 9px; overflow: hidden; position: relative; margin: 0 8px; }
    .bar-fill { background: linear-gradient(90deg, #4caf50, #2e7d32); height: 100%; width: 0%; transition: width 0.3s; }
    .bar-num { width: 65px; text-align: right; font-weight: bold; color: #1b5e20; }

    .stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; background: #f1f8e9; padding: 10px; border-radius: 8px; margin-bottom: 10px;
    }
    .stat-box { font-size: 0.8em; font-weight: bold; color: #555; }
    .stat-value { font-size: 1.15em; color: #1b5e20; display: block; margin-top: 2px; }
    
    .trophy-cabinet { background: #fff8e1; border: 1px solid #ffe082; padding: 8px; border-radius: 8px; margin-bottom: 10px; text-align: center; }

    button {
      width: 100%; padding: 12px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 6px;
    }
    button:hover { background: #1b5e20; }
    button:disabled { background: #b0bec5; cursor: not-allowed; }

    .modal-overlay { background: #fffde7; border: 2px solid #fbc02d; padding: 12px; border-radius: 8px; margin: 10px 0; }
    .choice-btn { background: #ffffff; color: #2e7d32; border: 1.5px solid #2e7d32; margin-top: 6px; text-align: left; padding: 8px 12px; font-size: 0.9em; width: 100%; cursor: pointer; border-radius: 6px; font-weight: bold; }
    .choice-btn:hover { background: #e8f5e9; }

    .train-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    .train-btn { background: #ff9800; color: #fff; font-size: 12px; padding: 8px; margin-top: 0; }
    .train-btn:hover { background: #f57c00; }

    .highlight-club { color: #40c4ff; font-weight: bold; }
    .highlight-gold { color: #ffd700; font-weight: bold; }
  </style>
</head>
<body>

  <!-- 1. 初始建角畫面 -->
  <div class="card" id="setup-card">
    <h1>⚽ 建立你的足球員</h1>
    <div class="setup-group">
      <label>球員姓名：</label>
      <input type="text" id="input-name" value="梅西二世">
    </div>
    <div class="setup-group">
      <label>球場位置：</label>
      <select id="input-pos">
        <option value="中鋒 (ST)">中鋒 (ST)</option>
        <option value="邊鋒 (LW/RW)">邊鋒 (LW/RW)</option>
        <option value="進攻中場 (CAM)">進攻中場 (CAM)</option>
        <option value="防守中場 (CDM)">防守中場 (CDM)</option>
        <option value="中後衛 (CB)">中後衛 (CB)</option>
      </select>
    </div>
    <div class="setup-group">
      <label>種族天賦血統：</label>
      <select id="input-race">
        <option value="euro">歐洲體系 (戰術組織與傳球天賦強, 傳/防上限 99)</option>
        <option value="latam">美洲爆發 (盤帶與射門技巧極佳, 盤/射上限 99)</option>
        <option value="africa">非洲神獸 (速度與身體對抗絕頂, 速/體上限 99)</option>
      </select>
    </div>
    <button onclick="startGame()">開始職業生涯</button>
  </div>

  <!-- 2. 主遊戲介面 (預設隱藏) -->
  <div class="card" id="game-card" style="display:none;">
    <h1 id="player-title">⚽ 職業足球人生</h1>
    <p style="text-align:center; color:#666; font-size:0.8em; margin:2px 0 6px 0;" id="seed-display"></p>
    
    <div class="status-bar" id="player-status"></div>
    
    <!-- 置頂廣播播報 (玩家不必拉到最下面) -->
    <div class="ticker-box">
      <ul id="career-log"></ul>
    </div>

    <div class="finance-bar">
      <div>身價：<span id="market-value"></span></div>
      <div>週薪：<span id="weekly-wage"></span></div>
      <div>存款：<span id="bank-balance"></span></div>
    </div>

    <!-- 長條圖能力表 -->
    <div class="bar-container">
      <div class="bar-row"><span class="bar-label">速度 (PAC)</span><div class="bar-bg"><div class="bar-fill" id="bar-pac"></div></div><span class="bar-num" id="num-pac"></span></div>
      <div class="bar-row"><span class="bar-label">射門 (SHO)</span><div class="bar-bg"><div class="bar-fill" id="bar-sho"></div></div><span class="bar-num" id="num-sho"></span></div>
      <div class="bar-row"><span class="bar-label">傳球 (PAS)</span><div class="bar-bg"><div class="bar-fill" id="bar-pas"></div></div><span class="bar-num" id="num-pas"></span></div>
      <div class="bar-row"><span class="bar-label">盤帶 (DRI)</span><div class="bar-bg"><div class="bar-fill" id="bar-dri"></div></div><span class="bar-num" id="num-dri"></span></div>
      <div class="bar-row"><span class="bar-label">防守 (DEF)</span><div class="bar-bg"><div class="bar-fill" id="bar-def"></div></div><span class="bar-num" id="num-def"></span></div>
      <div class="bar-row"><span class="bar-label">體能 (PHY)</span><div class="bar-bg"><div class="bar-fill" id="bar-phy"></div></div><span class="bar-num" id="num-phy"></span></div>
    </div>

    <div class="stats-grid">
      <div class="stat-box">年齡<span class="stat-value" id="age">17</span></div>
      <div class="stat-box">總評(OVR)<span class="stat-value" id="ovr">60</span></div>
      <div class="stat-box">上季進球<span class="stat-value" id="last-goals">0</span></div>
      <div class="stat-box">上季評分<span class="stat-value" id="last-rating">0.0</span></div>
    </div>

    <div class="trophy-cabinet">
      <div style="font-weight:bold; color:#f57f17; font-size:0.85em;">🏆 榮譽櫃 (Trophy Cabinet)</div>
      <div id="trophies-display" style="font-size:1em; margin-top:2px;">尚未獲得榮譽</div>
    </div>

    <!-- 互動決策容器 (事件專區) -->
    <div id="interactive-container"></div>

    <!-- 訓練加點區 (事件全數選完後才會解鎖) -->
    <div id="points-badge" style="display:none; background:#fff3e0; padding:10px; border-radius:8px; text-align:center; font-size:0.85em; font-weight:bold; color:#e65100; margin-bottom:10px; border:2px solid #ffe082;">
      ⚡ 事件決策完畢！請分配本季累積點數（剩餘：<span id="skill-points">0</span> 點）
      <div class="train-grid">
        <button class="train-btn" onclick="upgradeStat('pac')">+ 速度</button>
        <button class="train-btn" onclick="upgradeStat('sho')">+ 射門</button>
        <button class="train-btn" onclick="upgradeStat('pas')">+ 傳球</button>
        <button class="train-btn" onclick="upgradeStat('dri')">+ 盤帶</button>
        <button class="train-btn" onclick="upgradeStat('def')">+ 防守</button>
        <button class="train-btn" onclick="upgradeStat('phy')">+ 體能</button>
      </div>
    </div>

    <button id="next-year-btn" onclick="nextYear()">進行下一個賽季 (Next Season)</button>
    <button style="background:#0288d1; font-size:12px; padding:8px;" onclick="copyShareLink()">複製 Seed 分享連結</button>
  </div>

  <script>
    function mulberry32(a) {
      return function() {
        var t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }
    }
    function hashString(str) {
      let h1 = 1779033703, h2 = 3144134277;
      for (let i = 0, ch; i < str.length; i++) {
        ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      return h1 ^ h2;
    }
    const urlParams = new URLSearchParams(window.location.search);
    let seed = urlParams.get('seed') || Math.random().toString(36).substring(2, 10);
    window.history.replaceState({}, '', `?seed=${seed}`);
    const rng = mulberry32(hashString(seed));

    const realClubs = {
      youth: ["曼城青訓", "皇馬青訓", "拉瑪西亞", "拜仁青訓"],
      tier3: ["里茲聯", "桑德蘭", "赫塔費", "帕爾馬"],
      tier2: ["阿斯頓維拉", "布萊頓", "皇家蘇斯達", "亞特蘭大"],
      tier1: ["皇家馬德里", "曼徹斯特城", "阿森納", "拜仁慕尼黑", "巴塞隆納"]
    };

    const raceCaps = {
      euro:   { pac: 85, sho: 85, pas: 99, dri: 88, def: 99, phy: 88, name: "歐洲體系" },
      latam:  { pac: 92, sho: 99, pas: 90, dri: 99, def: 80, phy: 85, name: "美洲爆發" },
      africa: { pac: 99, sho: 85, pas: 80, dri: 88, def: 85, phy: 99, name: "非洲神獸" }
    };

    let player = {};

    function startGame() {
      let name = document.getElementById('input-name').value || "無名球星";
      let pos = document.getElementById('input-pos').value;
      let raceKey = document.getElementById('input-race').value;
      
      player = {
        name: name,
        position: pos,
        race: raceKey,
        caps: raceCaps[raceKey],
        age: 17,
        club: realClubs.youth[Math.floor(rng() * realClubs.youth.length)],
        tier: 0,
        pac: 55 + Math.floor(rng()*10),
        sho: 55 + Math.floor(rng()*10),
        pas: 55 + Math.floor(rng()*10),
        dri: 55 + Math.floor(rng()*10),
        def: 40 + Math.floor(rng()*10),
        phy: 55 + Math.floor(rng()*10),
        wage: 2000,
        balance: 10000,
        skillPoints: 0,
        trophies: [],
        lastGoals: 0,
        lastRating: "0.0",
        isRetired: false,
        pendingChoice: false,
        eventsFinished: true // 是否已選完當季事件
      };

      document.getElementById('setup-card').style.display = 'none';
      document.getElementById('game-card').style.display = 'block';
      document.getElementById('seed-display').innerText = `Seed：${seed}`;
      document.getElementById('player-title').innerText = `⚽ ${player.name} 的職業生涯`;

      addLog(`踏入足壇！${player.name} 出道於 <span class="highlight-club">${player.club}</span> (${player.caps.name})`);
      updateUI();
    }

    function getOVR() {
      return Math.round((player.pac + player.sho + player.pas + player.dri + player.def + player.phy) / 6);
    }

    function getMarketValue() {
      let ovr = getOVR();
      let val = Math.pow(ovr / 10, 3.5) * 1000;
      if (player.age > 30) val *= (1 - (player.age - 30) * 0.15);
      return Math.max(100000, Math.round(val));
    }

    function updateUI() {
      document.getElementById('age').innerText = player.age;
      document.getElementById('ovr').innerText = getOVR();
      document.getElementById('last-goals').innerText = player.lastGoals;
      document.getElementById('last-rating').innerText = player.lastRating;
      document.getElementById('player-status').innerText = `${player.name} | ${player.position} | 效力：${player.club}`;
      
      ['pac','sho','pas','dri','def','phy'].forEach(stat => {
        let val = player[stat];
        let cap = player.caps[stat];
        document.getElementById(`num-${stat}`).innerText = `${val} / ${cap}`;
        document.getElementById(`bar-${stat}`).style.width = `${(val / 99) * 100}%`;
      });

      document.getElementById('market-value').innerText = `€${(getMarketValue()/1000000).toFixed(1)}M`;
      document.getElementById('weekly-wage').innerText = `€${player.wage.toLocaleString()}`;
      document.getElementById('bank-balance').innerText = `€${Math.round(player.balance).toLocaleString()}`;

      document.getElementById('trophies-display').innerHTML = player.trophies.length > 0 ? player.trophies.join(' ') : '尚未獲得榮譽';

      // 只有事件選擇完畢且有剩餘點數時才顯示訓練面板
      const pb = document.getElementById('points-badge');
      if (player.eventsFinished && player.skillPoints > 0) {
        pb.style.display = 'block';
        document.getElementById('skill-points').innerText = player.skillPoints;
      } else { 
        pb.style.display = 'none'; 
      }

      const nextBtn = document.getElementById('next-year-btn');
      if (player.pendingChoice) {
        nextBtn.disabled = true;
        nextBtn.innerText = "請先進行事件決策...";
      } else if (!player.isRetired) {
        nextBtn.disabled = false;
        nextBtn.innerText = "進行下一個賽季 (Next Season)";
      }
    }

    function addLog(text) {
      const logList = document.getElementById('career-log');
      const li = document.createElement('li');
      li.innerHTML = `[${player.age}歲] ${text}`;
      logList.prepend(li);
      // 自動捲動到最頂部
      document.querySelector('.ticker-box').scrollTop = 0;
    }

    function upgradeStat(stat) {
      if (player.skillPoints <= 0) return;
      if (player[stat] >= player.caps[stat]) {
        alert(`已達到該種族的上限 (${player.caps[stat]})！`);
        return;
      }
      player[stat] = Math.min(player.caps[stat], player[stat] + 2);
      player.skillPoints--;
      updateUI();
    }

    // 含有「直接影響自由點數」的事件庫
    const interactiveEvents = [
      {
        title: "賽季特訓安排",
        desc: "休賽季教練為你規劃了個人特訓方案：",
        choices: [
          { text: "🎯 高強度戰術研修 (獲得 +3 點自由點數)", act: () => { player.skillPoints += 3; addLog("進行了高強度戰術研修，額外獲得 +3 自由點數！"); } },
          { text: "🏖️ 放假休息放鬆體能 (+速度上限屬性 2 點)", act: () => { player.pac = Math.min(player.caps.pac, player.pac + 2); addLog("充分休息，速度基礎小幅提升。"); } }
        ]
      },
      {
        title: "關鍵罰球執行",
        desc: "最後時刻獲得點球，你要親自罰球還是讓給隊友？",
        choices: [
          { text: "⚽ 親自主罰 (成功獲得 +2 點數，失手扣 1 點)", act: () => { 
            if(rng() > 0.3) { player.skillPoints += 2; addLog("🎯 穩穩罰進！展現大心臟，獲得 +2 自由點數！"); }
            else { player.skillPoints = Math.max(0, player.skillPoints - 1); addLog("❌ 踢飛點球，信心受到打擊 (扣除 1 點數)。"); }
          }},
          { text: "🤝 讓給射手隊友進球 (+傳球屬性 2 點)", act: () => { player.pas = Math.min(player.caps.pas, player.pas + 2); addLog("無私助攻隊友，獲得團隊讚譽。"); } }
        ]
      },
      {
        title: "商業代言爭取",
        desc: "知名運動品牌邀請你拍攝廣告：",
        choices: [
          { text: "💼 簽署代言合約 (獲得 €50,000 獎金)", act: () => { player.balance += 50000; addLog("順利簽約，獲得 €50,000 代言費。"); } },
          { text: "⚽ 拒絕代言專心訓練 (獲得 +2 點自由點數)", act: () => { player.skillPoints += 2; addLog("專注於訓練，獲得 +2 自由點數！"); } }
        ]
      }
    ];

    function nextYear() {
      if (player.isRetired || player.pendingChoice) return;
      player.age++;
      player.eventsFinished = false; // 標記為開始處理事件

      player.balance += player.wage * 52;

      // 1. 抽籤基礎點數 (5 ~ 10 點)
      let ptsGained = Math.floor(rng() * 6) + 5;
      if (player.age <= 29) {
        player.skillPoints += ptsGained;
        addLog(`⚡ 賽季結算抽籤！獲得 <strong>+${ptsGained}</strong> 點自由點數！`);
      }

      // 2. 比賽數據與難度加成
      let ovr = getOVR();
      let apps = Math.floor(28 + rng() * 10);
      let baseGoals = (player.sho * 0.3 + player.pac * 0.2) / 10;
      let goals = Math.max(0, Math.floor(apps * (baseGoals / 15) * (0.8 + rng() * 0.5)));
      let rating = (6.0 + (ovr / 30) + (goals / apps) * 2 + (rng() * 0.8 - 0.4)).toFixed(1);
      
      let winRatio = Math.min(0.8, (ovr + player.tier * 10) / 120);
      if (rng() < winRatio) {
        let matchBonus = player.tier + 1;
        player.skillPoints += matchBonus;
        addLog(`🏆 贏得高難度關鍵賽事，額外獲得 <strong>+${matchBonus}</strong> 點加成！`);
      }

      player.lastGoals = goals;
      player.lastRating = rating;
      addLog(`📊 本季代表球隊出場 ${apps} 次，進球 ⚽ <strong>${goals}</strong> 個，評分 🌟 <strong>${rating}</strong>`);

      // 3. 依序觸發 3 次選擇事件
      triggerNextEvent(0);
      updateUI();
    }

    function triggerNextEvent(index) {
      if (index >= 3) {
        // 3 個事件選擇結束，解鎖訓練加點
        player.eventsFinished = true;
        if (rng() < 0.35 && player.tier < 3) triggerTransfer();
        updateUI();
        return;
      }

      player.pendingChoice = true;
      let ev = interactiveEvents[Math.floor(rng() * interactiveEvents.length)];
      
      let html = `
        <div class="modal-overlay">
          <strong>📢 [事件 ${index+1}/3] ${ev.title}</strong>
          <p style="margin:4px 0 8px 0; font-size:0.9em;">${ev.desc}</p>
      `;

      ev.choices.forEach((c, i) => {
        html += `<button class="choice-btn" onclick="resolveEvent(${index}, ${i})">${c.text}</button>`;
      });
      html += `</div>`;

      document.getElementById('interactive-container').innerHTML = html;
      player.currentEv = ev;
      updateUI();
    }

    function resolveEvent(eventIndex, choiceIndex) {
      player.currentEv.choices[choiceIndex].act();
      player.pendingChoice = false;
      document.getElementById('interactive-container').innerHTML = '';
      updateUI();
      // 進行下一個事件
      triggerNextEvent(eventIndex + 1);
    }

    function triggerTransfer() {
      player.pendingChoice = true;
      let targetTier = player.tier + 1;
      let pool = targetTier === 1 ? realClubs.tier3 : targetTier === 2 ? realClubs.tier2 : realClubs.tier1;
      let clubA = pool[Math.floor(rng() * pool.length)];

      document.getElementById('interactive-container').innerHTML = `
        <div class="modal-overlay" style="border-color:#0288d1; background:#e1f5fe;">
          <strong>📩 收到轉會邀約！</strong>
          <button class="choice-btn" onclick="acceptTransfer('${clubA}', ${targetTier})">⚽ 加盟 <strong>${clubA}</strong> (週薪 €${Math.round(player.wage*1.8).toLocaleString()})</button>
          <button class="choice-btn" style="border-color:#757575;" onclick="rejectChoice()">✖ 拒絕，繼續留隊</button>
        </div>
      `;
      updateUI();
    }

    function acceptTransfer(club, tier) {
      player.club = club;
      player.tier = tier;
      player.wage = Math.round(player.wage * 1.8);
      player.pendingChoice = false;
      document.getElementById('interactive-container').innerHTML = '';
      addLog(`✍️ 完成轉會！正式簽約加盟 <span class="highlight-club">${club}</span>！`);
      updateUI();
    }

    function rejectChoice() {
      player.pendingChoice = false;
      document.getElementById('interactive-container').innerHTML = '';
      addLog(`🤝 選擇留隊。`);
      updateUI();
    }

    function copyShareLink() {
      navigator.clipboard.writeText(window.location.href);
      alert("已複製遊戲連結！");
    }
  </script>
</body>
