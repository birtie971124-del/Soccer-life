<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>職業足球人生 2.0 (Football Life Pro)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1d12;
      color: #333;
      max-width: 650px;
      margin: 15px auto;
      padding: 10px;
    }
    .card {
      background: #ffffff;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 15px;
    }
    h1 { margin: 0 0 5px 0; color: #1b4d24; text-align: center; font-size: 22px; }
    .status-bar {
      text-align: center;
      background: #1b4d24;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95em;
    }
    .finance-bar {
      display: flex;
      justify-content: space-around;
      background: #e8f5e9;
      padding: 8px;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 0.85em;
      font-weight: bold;
      color: #2e7d32;
    }
    .chart-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      margin: 10px auto;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      text-align: center;
      background: #f1f8e9;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .stat-box { font-size: 0.8em; font-weight: bold; color: #555; }
    .stat-value { font-size: 1.15em; color: #1b5e20; display: block; margin-top: 2px; }
    
    .trophy-cabinet {
      background: #fff8e1;
      border: 1px solid #ffe082;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
    }
    .trophy-title { font-weight: bold; color: #f57f17; font-size: 0.9em; margin-bottom: 5px; }
    .trophy-icons { font-size: 1.2em; }

    button {
      width: 100%;
      padding: 12px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
    button:hover { background: #1b5e20; }
    button:disabled { background: #b0bec5; cursor: not-allowed; }

    .modal-overlay {
      background: #f5f5f5;
      border: 2px solid #2e7d32;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
    }
    .choice-btn {
      background: #ffffff;
      color: #2e7d32;
      border: 1.5px solid #2e7d32;
      margin-top: 6px;
      text-align: left;
      padding: 8px 12px;
      font-size: 0.9em;
    }
    .choice-btn:hover { background: #e8f5e9; }

    .train-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .train-btn { background: #43a047; font-size: 12px; padding: 6px; margin-top: 0; }

    ul { padding-left: 18px; line-height: 1.5; font-size: 0.9em; }
    .log-item { margin-bottom: 6px; }
    .highlight-club { color: #1565c0; font-weight: bold; }
    .highlight-gold { color: #d84315; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h1>⚽ 職業足球人生 PRO</h1>
    <p style="text-align:center; color:#666; font-size:0.8em; margin:2px 0 8px 0;" id="seed-display">Seed: 加載中...</p>
    
    <div class="status-bar" id="player-status">位置：前鋒 | 效力：曼城青訓</div>
    <div class="finance-bar">
      <div>身價：<span id="market-value">€500K</span></div>
      <div>週薪：<span id="weekly-wage">€2,000</span></div>
      <div>存款：<span id="bank-balance">€10K</span></div>
    </div>

    <!-- 六維雷達圖 -->
    <div class="chart-container">
      <canvas id="radarChart"></canvas>
    </div>

    <div class="stats-grid">
      <div class="stat-box">年齡<span class="stat-value" id="age">17</span></div>
      <div class="stat-box">總評(OVR)<span class="stat-value" id="ovr">60</span></div>
      <div class="stat-box">上季進球<span class="stat-value" id="last-goals">0</span></div>
      <div class="stat-box">上季評分<span class="stat-value" id="last-rating">0.0</span></div>
    </div>

    <!-- 榮譽櫃 -->
    <div class="trophy-cabinet">
      <div class="trophy-title">🏆 榮譽櫃 (Trophy Cabinet)</div>
      <div class="trophy-icons" id="trophies-display">尚未獲得榮譽</div>
    </div>

    <!-- 訓練加點區 -->
    <div id="points-badge" style="display:none; background:#fff3e0; padding:8px; border-radius:8px; text-align:center; font-size:0.85em; font-weight:bold; color:#e65100; margin-bottom:10px;">
      ⚡ 獲得訓練點數：<span id="skill-points">0</span> 點
      <div class="train-grid">
        <button class="train-btn" onclick="upgradeStat('pac')">+ 速度 (PAC)</button>
        <button class="train-btn" onclick="upgradeStat('sho')">+ 射門 (SHO)</button>
        <button class="train-btn" onclick="upgradeStat('pas')">+ 傳球 (PAS)</button>
        <button class="train-btn" onclick="upgradeStat('dri')">+ 盤帶 (DRI)</button>
        <button class="train-btn" onclick="upgradeStat('def')">+ 防守 (DEF)</button>
        <button class="train-btn" onclick="upgradeStat('phy')">+ 體能 (PHY)</button>
      </div>
    </div>

    <!-- 互動選擇容器 -->
    <div id="interactive-container"></div>

    <button id="next-year-btn" onclick="nextYear()">進行下一個賽季 (Next Season)</button>
    <button style="background:#0288d1;" onclick="copyShareLink()">複製 Seed Share 連結</button>
  </div>

  <div class="card">
    <h3>📜 生涯紀錄與履歷</h3>
    <ul id="career-log"></ul>
  </div>

  <script>
    // --- 1. Seed & PRNG ---
    function mulberry32(a) {
      return function() {
        var t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }
    }
    function hashString(str) {
      let h1 = 1779033703, h2 = 3144134277;
      for (let i = 0, ch; i < str.length; i++) {
        ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      return h1 ^ h2;
    }
    const urlParams = new URLSearchParams(window.location.search);
    let seed = urlParams.get('seed') || Math.random().toString(36).substring(2, 10);
    window.history.replaceState({}, '', `?seed=${seed}`);
    document.getElementById('seed-display').innerText = `Seed：${seed}`;
    const rng = mulberry32(hashString(seed));

    // --- 2. 球員與資料庫 ---
    const realClubs = {
      youth: ["曼城青訓", "皇馬青訓", "拉瑪西亞 (巴塞青訓)", "拜仁青訓"],
      tier3: ["里茲聯", "桑德蘭", "赫塔費", "帕爾馬"],
      tier2: ["阿斯頓維拉", "布萊頓", "皇家蘇斯達", "亞特蘭大"],
      tier1: ["皇家馬德里", "曼徹斯特城", "阿森納", "拜仁慕尼黑", "巴塞隆納"]
    };

    let player = {
      age: 17,
      position: "前鋒 (ST)",
      club: realClubs.youth[Math.floor(rng() * realClubs.youth.length)],
      tier: 0,
      // 六維屬性
      pac: 60 + Math.floor(rng()*10),
      sho: 55 + Math.floor(rng()*10),
      pas: 50 + Math.floor(rng()*10),
      dri: 58 + Math.floor(rng()*10),
      def: 30 + Math.floor(rng()*10),
      phy: 55 + Math.floor(rng()*10),
      // 財務與數據
      wage: 2000,
      balance: 10000,
      skillPoints: 0,
      trophies: [],
      lastGoals: 0,
      lastRating: "0.0",
      isRetired: false,
      pendingChoice: false
    };

    function getOVR() {
      return Math.round((player.pac + player.sho + player.pas + player.dri + player.def + player.phy) / 6);
    }

    function getMarketValue() {
      let ovr = getOVR();
      let val = Math.pow(ovr / 10, 3.5) * 1000;
      if (player.age > 30) val *= (1 - (player.age - 30) * 0.15);
      return Math.max(100000, Math.round(val));
    }

    // --- 3. Chart.js 雷達圖 ---
    const ctx = document.getElementById('radarChart').getContext('2d');
    let radarChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: ['速度 (PAC)', '射門 (SHO)', '傳球 (PAS)', '盤帶 (DRI)', '防守 (DEF)', '體能 (PHY)'],
        datasets: [{
          label: '能力值',
          data: [player.pac, player.sho, player.pas, player.dri, player.def, player.phy],
          backgroundColor: 'rgba(46, 125, 50, 0.2)',
          borderColor: '#2e7d32',
          pointBackgroundColor: '#1b5e20'
        }]
      },
      options: {
        scales: { r: { min: 20, max: 99, ticks: { display: false } } },
        plugins: { legend: { display: false } }
      }
    });

    function updateUI() {
      document.getElementById('age').innerText = player.age;
      document.getElementById('ovr').innerText = getOVR();
      document.getElementById('last-goals').innerText = player.lastGoals;
      document.getElementById('last-rating').innerText = player.lastRating;
      document.getElementById('player-status').innerText = `位置：${player.position} | 效力：${player.club}`;
      
      document.getElementById('market-value').innerText = `€${(getMarketValue()/1000000).toFixed(1)}M`;
      document.getElementById('weekly-wage').innerText = `€${player.wage.toLocaleString()}`;
      document.getElementById('bank-balance').innerText = `€${Math.round(player.balance).toLocaleString()}`;

      // 榮譽櫃
      document.getElementById('trophies-display').innerHTML = player.trophies.length > 0 
        ? player.trophies.join(' ') 
        : '<span style="color:#aaa; font-size:0.8em;">尚未獲得榮譽</span>';

      // 訓練點數
      const pb = document.getElementById('points-badge');
      if (player.skillPoints > 0) {
        pb.style.display = 'block';
        document.getElementById('skill-points').innerText = player.skillPoints;
      } else { pb.style.display = 'none'; }

      // 更新雷達圖
      radarChart.data.datasets[0].data = [player.pac, player.sho, player.pas, player.dri, player.def, player.phy];
      radarChart.update();

      const nextBtn = document.getElementById('next-year-btn');
      if (player.pendingChoice) {
        nextBtn.disabled = true;
        nextBtn.innerText = "請先完成上面的決策...";
      } else if (!player.isRetired) {
        nextBtn.disabled = false;
        nextBtn.innerText = "進行下一個賽季 (Next Season)";
      }
    }

    function addLog(text) {
      const logList = document.getElementById('career-log');
      const li = document.createElement('li');
      li.className = 'log-item';
      li.innerHTML = `<strong>${player.age} 歲：</strong> ${text}`;
      logList.prepend(li);
    }

    addLog(`踏入足壇！出道於 <span class="highlight-club">${player.club}</span>，初始 OVR：${getOVR()}`);
    updateUI();

    // --- 4. 訓練加點 ---
    function upgradeStat(stat) {
      if (player.skillPoints <= 0) return;
      player[stat] = Math.min(99, player[stat] + 3);
      player.skillPoints--;
      updateUI();
    }

    // --- 5. 賽季與模擬系統 ---
    function nextYear() {
      if (player.isRetired || player.pendingChoice) return;
      player.age++;

      // 領薪水
      player.balance += player.wage * 52;

      // 比賽模擬公式
      let ovr = getOVR();
      let apps = Math.floor(25 + rng() * 15); // 出場 25-40 場
      let baseGoals = (player.sho * 0.3 + player.pac * 0.2) / 10;
      let goals = Math.max(0, Math.floor(apps * (baseGoals / 15) * (0.8 + rng() * 0.5)));
      let rating = (6.0 + (ovr / 30) + (goals / apps) * 2 + (rng() * 0.8 - 0.4)).toFixed(1);
      
      player.lastGoals = goals;
      player.lastRating = rating;

      addLog(`📊 本賽季代表球隊出場 ${apps} 次，攻入 ⚽ <strong>${goals}</strong> 球，平均評分 🌟 <strong>${rating}</strong>`);

      // 衰退機制
      if (player.age > 30) {
        let dec = Math.floor(rng() * 3) + 1;
        player.pac = Math.max(30, player.pac - dec);
        player.phy = Math.max(30, player.phy - dec);
      }

      // 給予訓練點數
      if (player.age <= 28) player.skillPoints += 2;

      // 事件觸發 (隨機事件/合約/轉會)
      let dice = rng();
      if (dice < 0.3 && player.tier < 3) {
        triggerTransfer();
      } else if (dice < 0.5) {
        triggerOffFieldEvent();
      } else if (rating >= 7.8) {
        // 獲得榮譽
        if (player.tier === 3 && !player.trophies.includes("🏆 歐冠")) {
          player.trophies.push("🏆 歐冠");
          addLog(`🏆 隨 <span class="highlight-club">${player.club}</span> 捧起 <span class="highlight-gold">歐洲冠軍聯賽獎盃</span>！`);
        } else if (goals > 25 && !player.trophies.includes("🥇 金靴獎")) {
          player.trophies.push("🥇 金靴獎");
          addLog(`🥇 憑藉單季 ${goals} 球榮穫 <span class="highlight-gold">聯賽金靴獎</span>！`);
        }
      }

      // 引退
      if (player.age >= 37 || player.phy < 35) {
        player.isRetired = true;
        addLog(`<strong>🏆 正式挂靴引退！職業生涯總存款：€${Math.round(player.balance).toLocaleString()}</strong>`);
        document.getElementById('next-year-btn').disabled = true;
        document.getElementById('next-year-btn').innerText = "已引退";
      }

      updateUI();
    }

    // 轉會事件
    function triggerTransfer() {
      player.pendingChoice = true;
      let targetTier = player.tier + 1;
      let pool = targetTier === 1 ? realClubs.tier3 : targetTier === 2 ? realClubs.tier2 : realClubs.tier1;
      let clubA = pool[Math.floor(rng() * pool.length)];
      let clubB = pool[Math.floor(rng() * pool.length)];

      document.getElementById('interactive-container').innerHTML = `
        <div class="modal-overlay">
          <strong>📩 轉會邀約！</strong>
          <p style="margin:4px 0;">憑藉優異表現，以下球隊向你發出轉會邀請：</p>
          <button class="choice-btn" onclick="acceptTransfer('${clubA}', ${targetTier})">⚽ 加盟 <strong>${clubA}</strong> (週薪 €${Math.round(player.wage*1.8).toLocaleString()})</button>
          <button class="choice-btn" onclick="acceptTransfer('${clubB}', ${targetTier})">⚽ 加盟 <strong>${clubB}</strong> (週薪 €${Math.round(player.wage*1.8).toLocaleString()})</button>
          <button class="choice-btn" style="border-color:#757575;" onclick="rejectChoice()">✖ 拒絕，續留 ${player.club}</button>
        </div>
      `;
      updateUI();
    }

    function acceptTransfer(club, tier) {
      player.club = club;
      player.tier = tier;
      player.wage = Math.round(player.wage * 1.8);
      player.pendingChoice = false;
      document.getElementById('interactive-container').innerHTML = '';
      addLog(`✍️ 完成轉會！正式加盟 <span class="highlight-club">${club}</span>！`);
      updateUI();
    }

    // 場外抉擇事件
    function triggerOffFieldEvent() {
      player.pendingChoice = true;
      document.getElementById('interactive-container').innerHTML = `
        <div class="modal-overlay">
          <strong>📢 休賽季選擇！</strong>
          <p style="margin:4px 0;">這個休賽季你打算如何安排時間？</p>
          <button class="choice-btn" onclick="resolveOffField('ad')">💼 拍攝商業代言廣告 (獲得 €50,000 代言費)</button>
          <button class="choice-btn" onclick="resolveOffField('train')">🏋️ 自費前往高原封閉特訓 (獲得 3 點訓練點數)</button>
        </div>
      `;
      updateUI();
    }

    function resolveOffField(type) {
      if (type === 'ad') {
        player.balance += 50000;
        addLog(`💰 拍攝知名品牌代言廣告，賺取了 €50,000 代言費。`);
      } else {
        player.skillPoints += 3;
        addLog(`🏋️ 進行魔鬼特訓，個人能力得到突破！`);
      }
      player.pendingChoice = false;
      document.getElementById('interactive-container').innerHTML = '';
      updateUI();
    }

    function rejectChoice() {
      player.pendingChoice = false;
      document.getElementById('interactive-container').innerHTML = '';
      addLog(`🤝 選擇留隊，繼續為 <span class="highlight-club">${player.club}</span> 效力。`);
      updateUI();
    }

    function copyShareLink() {
      navigator.clipboard.writeText(window.location.href);
      alert("已複製遊戲連結！");
    }
  </script>
</body>
</html>
