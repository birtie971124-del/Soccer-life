<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>足球人生 (Football Career)</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0b1d12;
      color: #333;
      max-width: 650px;
      margin: 20px auto;
      padding: 15px;
    }
    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    h1 { margin-top: 0; color: #1b4d24; text-align: center; font-size: 24px; }
    .status-bar {
      text-align: center;
      background: #e8f5e9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
      color: #1b5e20;
      border: 1px solid #c8e6c9;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
      background: #f1f8e9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .stat-box { font-size: 0.85em; font-weight: bold; color: #333; }
    .stat-value { font-size: 1.25em; color: #2e7d32; display: block; margin-top: 4px; }
    
    .points-badge {
      background: #fff3e0;
      border: 1px solid #ffe0b2;
      color: #e65100;
      padding: 8px 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
      display: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    button:hover { background: #1b5e20; }
    button:disabled { background: #b0bec5; cursor: not-allowed; }
    
    .share-btn { background: #0288d1; }
    .share-btn:hover { background: #01579b; }

    /* 互動選項區塊 */
    .modal-overlay {
      background: #f5f5f5;
      border: 2px solid #2e7d32;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }
    .choice-btn {
      background: #ffffff;
      color: #2e7d32;
      border: 2px solid #2e7d32;
      margin-top: 8px;
      text-align: left;
      padding: 10px 14px;
    }
    .choice-btn:hover {
      background: #e8f5e9;
      color: #1b5e20;
    }

    /* 訓練加點區 */
    .train-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .train-btn {
      background: #43a047;
      font-size: 14px;
      padding: 8px;
      margin-top: 0;
    }
    .train-btn:hover { background: #2e7d32; }

    ul { padding-left: 20px; line-height: 1.6; }
    .log-item { margin-bottom: 8px; font-size: 0.95em; }
    .highlight-gold { color: #d84315; font-weight: bold; }
    .highlight-club { color: #1565c0; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h1>⚽ 足球人生模擬器</h1>
    <p style="text-align:center; color:#666; font-size:0.85em;" id="seed-display">Seed: 加載中...</p>
    
    <div class="status-bar" id="player-status">
      位置：前鋒 | 目前效力：曼徹斯特城青訓
    </div>

    <div class="stats">
      <div class="stat-box">年齡<span class="stat-value" id="age">17</span></div>
      <div class="stat-box">射門/防守<span class="stat-value" id="shooting">55</span></div>
      <div class="stat-box">傳球/組織<span class="stat-value" id="passing">55</span></div>
      <div class="stat-box">體能/速度<span class="stat-value" id="stamina">60</span></div>
    </div>

    <div class="points-badge" id="points-badge">
      ⚡ 獲得自由訓練點數：<span id="skill-points">0</span> 點
      <div class="train-grid">
        <button class="train-btn" onclick="upgradeStat('shooting')">+ 射門/防守</button>
        <button class="train-btn" onclick="upgradeStat('passing')">+ 傳球/組織</button>
        <button class="train-btn" onclick="upgradeStat('stamina')">+ 體能/速度</button>
      </div>
    </div>

    <!-- 互動選擇容器 -->
    <div id="interactive-container"></div>

    <button id="next-year-btn" onclick="nextYear()">推進一個賽季 (Next Season)</button>
    <button class="share-btn" onclick="copyShareLink()">複製遊戲連結分享 (帶 Seed)</button>
  </div>

  <div class="card">
    <h3>📜 職業生涯履歷與榮譽紀錄</h3>
    <ul id="career-log"></ul>
  </div>

  <script>
    // --- 1. PRNG 隨機數生成器 ---
    function mulberry32(a) {
      return function() {
        var t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }
    }

    function hashString(str) {
      let h1 = 1779033703, h2 = 3144134277;
      for (let i = 0, ch; i < str.length; i++) {
        ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      return h1 ^ h2;
    }

    const urlParams = new URLSearchParams(window.location.search);
    let seed = urlParams.get('seed');
    if (!seed) {
      seed = Math.random().toString(36).substring(2, 10);
      window.history.replaceState({}, '', `?seed=${seed}`);
    }
    
    document.getElementById('seed-display').innerText = `目前 Seed：${seed}`;
    const rng = mulberry32(hashString(seed));

    // --- 2. 真實球隊資料庫 (按層級分類) ---
    const realClubs = {
      youth: ["曼徹斯特城青訓", "皇家馬德里青訓", "巴塞隆納青訓 (La Masia)", "拜仁慕尼黑青訓", "阿賈克斯青訓"],
      tier3: ["里茲聯 (Leeds United)", "桑德蘭 (Sunderland)", "赫塔費 (Getafe)", "科隆 (FC Köln)", "帕爾馬 (Parma)"],
      tier2: ["阿斯頓維拉 (Aston Villa)", "布萊頓 (Brighton)", "皇家蘇斯達 (Real Sociedad)", "法蘭克福 (Frankfurt)", "亞特蘭大 (Atalanta)"],
      tier1: ["皇家馬德里 (Real Madrid)", "曼徹斯特城 (Manchester City)", "阿森納 (Arsenal)", "拜仁慕尼黑 (Bayern Munich)", "巴塞隆納 (Barcelona)", "巴黎聖日耳曼 (PSG)"]
    };

    const positions = ["中鋒 (ST)", "邊鋒 (LW/RW)", "進攻中場 (CAM)", "防守中場 (CDM)", "中後衛 (CB)"];

    let player = {
      age: 17,
      position: positions[Math.floor(rng() * positions.length)],
      currentClub: realClubs.youth[Math.floor(rng() * realClubs.youth.length)],
      clubTier: 0, // 0: 青訓, 1: 聯賽次級/中下游, 2: 聯賽中上游, 3: 頂級豪門
      shooting: 50 + Math.floor(rng() * 15),
      passing: 50 + Math.floor(rng() * 15),
      stamina: 55 + Math.floor(rng() * 15),
      skillPoints: 0,
      isRetired: false,
      pendingChoice: false
    };

    function updateUI() {
      document.getElementById('age').innerText = player.age;
      document.getElementById('shooting').innerText = player.shooting;
      document.getElementById('passing').innerText = player.passing;
      document.getElementById('stamina').innerText = player.stamina;
      document.getElementById('player-status').innerText = `位置：${player.position} | 目前效力：${player.currentClub}`;

      // 訓練加點區顯示
      const pointsBadge = document.getElementById('points-badge');
      if (player.skillPoints > 0) {
        pointsBadge.style.display = 'block';
        document.getElementById('skill-points').innerText = player.skillPoints;
      } else {
        pointsBadge.style.display = 'none';
      }

      // 控制推進按鈕狀態
      const nextBtn = document.getElementById('next-year-btn');
      if (player.pendingChoice) {
        nextBtn.disabled = true;
        nextBtn.innerText = "請先完成上面的轉會選擇...";
      } else if (!player.isRetired) {
        nextBtn.disabled = false;
        nextBtn.innerText = "推進一個賽季 (Next Season)";
      }
    }

    function addLog(text) {
      const logList = document.getElementById('career-log');
      const li = document.createElement('li');
      li.className = 'log-item';
      li.innerHTML = `<strong>${player.age} 歲：</strong> ${text}`;
      logList.prepend(li);
    }

    // 初始記錄
    addLog(`踏入足壇！加入 <span class="highlight-club">${player.currentClub}</span>。位置：${player.position}，初始能力：射門/防守 ${player.shooting} | 傳球 ${player.passing} | 體能 ${player.stamina}`);
    updateUI();

    // --- 3. 升級加點功能 ---
    function upgradeStat(statName) {
      if (player.skillPoints <= 0) return;
      player[statName] += 3; // 每點加 3 點屬性
      player.skillPoints--;
      
      let statCN = statName === 'shooting' ? '射門/防守' : statName === 'passing' ? '傳球/組織' : '體能/速度';
      addLog(`🎯 經過專注特訓，【${statCN}】提升了 3 點！`);
      updateUI();
    }

    // --- 4. 轉會選隊互動介面 ---
    function offerTransferChoices(targetTier, reasonText) {
      player.pendingChoice = true;
      const container = document.getElementById('interactive-container');
      
      // 隨機抽選 2 家目標層級的真實球隊
      let pool = [];
      if (targetTier === 1) pool = realClubs.tier3;
      else if (targetTier === 2) pool = realClubs.tier2;
      else if (targetTier === 3) pool = realClubs.tier1;

      // 隨機選出兩隊
      let clubA = pool[Math.floor(rng() * pool.length)];
      let clubB = pool[Math.floor(rng() * pool.length)];
      while (clubA === clubB) {
        clubB = pool[Math.floor(rng() * pool.length)];
      }

      container.innerHTML = `
        <div class="modal-overlay">
          <strong>📩 收到轉會邀約！</strong>
          <p style="margin: 5px 0 10px 0; font-size:0.9em; color:#555;">${reasonText}</p>
          <button class="choice-btn" onclick="selectClub('${clubA}', ${targetTier})">⚽ 加盟 <strong>${clubA}</strong> (給予主力承諾)</button>
          <button class="choice-btn" onclick="selectClub('${clubB}', ${targetTier})">⚽ 加盟 <strong>${clubB}</strong> (挑戰新環境)</button>
          <button class="choice-btn" style="border-color:#757575; color:#424242;" onclick="rejectTransfer()">✖ 拒絕邀約，留在 <strong>${player.currentClub}</strong></button>
        </div>
      `;
      updateUI();
    }

    function selectClub(newClub, tier) {
      player.currentClub = newClub;
      player.clubTier = tier;
      player.pendingChoice = false;
      document.getElementById('interactive-container').innerHTML = '';
      addLog(`✍️ 完成轉會！正式簽約加盟 <span class="highlight-club">${newClub}</span>！`);
      updateUI();
    }

    function rejectTransfer() {
      player.pendingChoice = false;
      document.getElementById('interactive-container').innerHTML = '';
      addLog(`🤝 選擇堅守陣營，繼續效力 <span class="highlight-club">${player.currentClub}</span>。`);
      updateUI();
    }

    // --- 5. 賽季推進主邏輯 ---
    function nextYear() {
      if (player.isRetired || player.pendingChoice) return;

      player.age++;

      // 老化衰退機制
      let declineStamina = player.age > 30 ? Math.floor(rng() * 4) + 1 : 0;
      let declineTech = player.age > 33 ? Math.floor(rng() * 3) + 1 : 0;

      // 隨機機率獲得升級加點 (年輕時容易獲得)
      if (player.age <= 30 && rng() > 0.3) {
        player.skillPoints++;
      }

      // 事件判定
      const dice = rng();

      if (dice < 0.25 && player.clubTier < 3) {
        // 觸發轉會選隊機會
        let nextTier = player.clubTier + 1;
        if (nextTier === 1) {
          offerTransferChoices(1, "職業生涯起飛！有低層級職業球隊向你發出第一份正式合約邀約。");
        } else if (nextTier === 2) {
          offerTransferChoices(2, "聯賽表現亮眼，吸引了五大聯賽勁旅的目光！");
        } else if (nextTier === 3) {
          offerTransferChoices(3, "世界級天賦爆發！頂級豪門球隊開出天價轉會費邀請你加盟！");
        }
      } else if (dice < 0.45) {
        // 賽事優秀事件
        player.shooting += Math.max(0, 3 - declineTech);
        player.passing += Math.max(0, 3 - declineTech);
        addLog(`🔥 在關鍵比賽中踢進絕殺球，幫助 <span class="highlight-club">${player.currentClub}</span> 贏得聯賽關鍵勝仗！`);
      } else if (dice < 0.6) {
        // 榮譽事件 (豪門容易拿冠軍)
        if (player.clubTier === 3 && rng() > 0.4) {
          addLog(`🏆 隨 <span class="highlight-club">${player.currentClub}</span> 捧起 <span class="highlight-gold">歐洲冠軍聯賽 (UCL) 冠軍獎盃</span>！`);
          player.skillPoints += 2;
        } else {
          addLog(`🏅 獲選為球隊賽季最佳球員，狀態極佳。`);
          player.skillPoints += 1;
        }
      } else if (dice < 0.75) {
        // 傷病事件
        player.stamina = Math.max(0, player.stamina - 5 - declineStamina);
        addLog(`🚑 賽季中遭遇腿筋拉傷休養數月，體能有所下滑。`);
      } else {
        // 平穩賽季
        addLog(`平穩度過一個賽季，作為團隊主力持續貢獻力量。`);
      }

      // 扣除老化
      player.shooting = Math.max(0, player.shooting - declineTech);
      player.passing = Math.max(0, player.passing - declineTech);
      player.stamina = Math.max(0, player.stamina - declineStamina);

      if (declineStamina > 0 || declineTech > 0) {
        addLog(`<span style="color:#c62828;">(受到年齡增長影響，體能與狀態開始衰退)</span>`);
      }

      // 引退條件
      if (player.age >= 38 || player.stamina < 30) {
        player.isRetired = true;
        addLog(`<strong>🏆 宣布正式挂靴引退！在 <span class="highlight-club">${player.currentClub}</span> 結束了長達 ${player.age - 17} 年的傳奇生涯。</strong>`);
        const btn = document.getElementById('next-year-btn');
        btn.disabled = true;
        btn.innerText = "已引退 (可分享 Seed 戰績)";
        btn.style.background = "#9e9e9e";
      }

      updateUI();
    }

    function copyShareLink() {
      navigator.clipboard.writeText(window.location.href);
      alert("已複製遊戲連結！朋友開啟此連結將會體驗一模一樣的轉會與生涯故事。");
    }
  </script>
</body>
</html>
